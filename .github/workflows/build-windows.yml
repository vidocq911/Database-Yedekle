name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure bundled Google OAuth client
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_JSON)) {
            throw "Missing repository secret GOOGLE_OAUTH_CLIENT_JSON. Add the Google OAuth Desktop client JSON as this GitHub Actions secret; do not commit client_secrets.json to the repository."
          }
          $env:GOOGLE_OAUTH_CLIENT_JSON | Set-Content -Path client_secrets.json -Encoding utf8
          $config = Get-Content client_secrets.json -Raw | ConvertFrom-Json
          if (-not $config.installed) {
            throw "GOOGLE_OAUTH_CLIENT_JSON must be a Google OAuth Desktop app client JSON (installed)."
          }

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 paramiko

      - name: Check Python syntax
        run: python -m py_compile Database_Yedekle.py

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "client_secrets.json;." --collect-all googleapiclient --collect-all google_auth_oauthlib --collect-all google.auth --name "Database Yedekle" Database_Yedekle.py

      - name: Create distribution package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist/Database Yedekle.exe" package/
          @(
            "Database Yedekle - Windows"
            "=========================="
            ""
            "1. Extract this ZIP to a folder."
            "2. Run Database Yedekle.exe."
            "3. Click Google hesabını bağla and sign in to your Google account in the browser."
            "4. The Google OAuth client configuration is bundled in the app; you do not need to find or provide a JSON file."
            "5. For remote QNAP, enable/configure SFTP on QNAP and enter its reachable hostname, port, username, password, and remote directory."
            "6. This build is not code-signed, so Windows SmartScreen may still show a warning."
          ) | Set-Content -Encoding utf8 package/README.txt
          Remove-Item client_secrets.json -Force
          Compress-Archive -Path package/* -DestinationPath "Database-Yedekle-Windows.zip" -Force

      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: Database-Yedekle-Windows
          path: Database-Yedekle-Windows.zip
          if-no-files-found: error
          retention-days: 30
