name: Build Windows EXE

on:
  push:
    branches: [main, feature/licensing-customer-management]
  workflow_dispatch:

# Keep only the newest build for each branch.
concurrency:
  group: build-windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .github/workflows/build-windows.yml

      - name: Configure bundled cloud OAuth clients
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_JSON)) {
            Write-Warning "Google Drive is not configured for this build. The app will still build, but Google Drive sign-in will be unavailable until GOOGLE_OAUTH_CLIENT_JSON is added."
          } else {
            $env:GOOGLE_OAUTH_CLIENT_JSON | Set-Content -Path client_secrets.json -Encoding utf8
            $config = Get-Content client_secrets.json -Raw | ConvertFrom-Json
            if (-not $config.installed) {
              Remove-Item client_secrets.json -Force -ErrorAction SilentlyContinue
              throw "GOOGLE_OAUTH_CLIENT_JSON must be a Google OAuth Desktop app client JSON (installed)."
            }
          }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ANON_KEY)) {
            Write-Warning "Demo registration is disabled until SUPABASE_ANON_KEY is configured as a repository secret."
          } else {
            $env:SUPABASE_ANON_KEY | Set-Content -Path supabase_anon_key.txt -Encoding utf8
          }
          if ([string]::IsNullOrWhiteSpace($env:DROPBOX_APP_KEY)) {
            Write-Host "Dropbox not configured: add DROPBOX_APP_KEY GitHub Actions secret to enable Dropbox."
          } else {
            $env:DROPBOX_APP_KEY | Set-Content -Path dropbox_app_key.txt -Encoding utf8
          }

      - name: Install database command-line tools
        shell: pwsh
        run: |
          choco install postgresql --yes --no-progress --params "/Password:BuildOnlyPassword123!"
          choco install sqlcmd --yes --no-progress
          New-Item -ItemType Directory -Force -Path vendor-tools | Out-Null
          $pg = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($pg) { Copy-Item "$($pg.FullName)\bin\*" vendor-tools/ -Force }
          $sqlcmd = Get-Command sqlcmd.exe -ErrorAction SilentlyContinue
          if ($sqlcmd) { Copy-Item $sqlcmd.Source vendor-tools/sqlcmd.exe -Force }
          if (-not (Test-Path vendor-tools/pg_dump.exe)) { throw "PostgreSQL pg_dump.exe was not found after installation." }
          if (-not (Test-Path vendor-tools/sqlcmd.exe)) { throw "sqlcmd.exe was not found after installation." }

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller pillow pyautogui pygetwindow PySide6 google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 paramiko cryptography dropbox boto3

      - name: Fetch official database logos
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://commons.wikimedia.org/wiki/Special:Redirect/file/Microsoft_SQL_Server_2025_icon.svg" -OutFile "sql-server-logo.svg"
          Invoke-WebRequest -Uri "https://wiki.postgresql.org/wiki/Special:Redirect/file/PostgreSQL_logo.3colors.svg" -OutFile "postgresql-logo.svg"
          if ((Get-Item "sql-server-logo.svg").Length -lt 1000) { throw "SQL Server logo download failed." }
          if ((Get-Item "postgresql-logo.svg").Length -lt 1000) { throw "PostgreSQL logo download failed." }

      - name: Check Python syntax
        run: python -m py_compile database_yedekle_qt.py licensing_client.py license_manager.py scripts/generate_license_signing_key.py

      - name: Test license verification
        run: python -m unittest discover -s tests -v

      - name: Create application icon
        shell: pwsh
        run: |
          python -c "from PIL import Image,ImageDraw; im=Image.new('RGBA',(256,256),'#0B1020'); d=ImageDraw.Draw(im); d.polygon([(128,12),(232,72),(128,132),(24,72)],fill='#22D3EE',outline='#A5F3FC',width=5); d.line([(24,72),(128,132),(232,72)],fill='#E0F2FE',width=5); d.polygon([(24,72),(128,132),(128,176),(24,116)],fill='#0E7490',outline='#22D3EE',width=4); d.polygon([(232,72),(128,132),(128,176),(232,116)],fill='#5B21B6',outline='#8B5CF6',width=4); d.polygon([(128,70),(206,116),(128,162),(50,116)],fill='#7C3AED',outline='#A78BFA',width=4); d.polygon([(50,116),(128,162),(128,204),(50,158)],fill='#4C1D95',outline='#8B5CF6',width=4); d.polygon([(206,116),(128,162),(128,204),(206,158)],fill='#312E81',outline='#6366F1',width=4); d.polygon([(128,34),(206,80),(128,126),(50,80)],fill='#22D3EE',outline='#A5F3FC',width=4); d.line([(50,80),(128,126),(206,80)],fill='#E0F2FE',width=4); im.save('Database-Yedekle.ico',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          @(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">'
            '<rect width="256" height="256" rx="42" fill="#10284a"/>'
            '<path d="M28 58a75 29 0 0 1 150 0v112a75 29 0 0 1-150 0z" fill="#173e6a" stroke="#55d8ff" stroke-width="9"/>'
            '<ellipse cx="103" cy="58" rx="75" ry="29" fill="#10284a" stroke="#55d8ff" stroke-width="9"/>'
            '<path d="M28 100a75 29 0 0 0 150 0M28 142a75 29 0 0 0 150 0" fill="none" stroke="#55d8ff" stroke-width="7"/>'
            '<circle cx="188" cy="185" r="49" fill="#2695ff" stroke="#b8f2ff" stroke-width="5"/>'
            '<path d="m164 185 17 18 34-39" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>'
            '</svg>'
          ) | Set-Content -Encoding utf8 Database_Yedekle_Logo.svg

      - name: Build executable
        shell: pwsh
        run: |
          $common = @("--noconfirm","--onefile","--windowed","--icon","Database-Yedekle.ico","--collect-all","googleapiclient","--collect-all","google_auth_oauthlib","--collect-all","google.auth","--name","Database Yedekle","database_yedekle_qt.py")
          $data = @()
          if (Test-Path vendor-tools) { Get-ChildItem vendor-tools -File | ForEach-Object { $data += @("--add-binary", "$($_.FullName);.") } }
          if (Test-Path client_secrets.json) { $data += @("--add-data", "client_secrets.json;.") }
          if (Test-Path dropbox_app_key.txt) { $data += @("--add-data", "dropbox_app_key.txt;.") }
          if (Test-Path supabase_anon_key.txt) { $data += @("--add-data", "supabase_anon_key.txt;.") }
          if (Test-Path license-public-jwk.json) { $data += @("--add-data", "license-public-jwk.json;.") }
          if (Test-Path sql-server-logo.svg) { $data += @("--add-data", "sql-server-logo.svg;.") }
          if (Test-Path postgresql-logo.svg) { $data += @("--add-data", "postgresql-logo.svg;.") }
          $common += @("--collect-all","dropbox")
          python -m PyInstaller @common @data

      - name: GUI smoke test and screenshots
        shell: pwsh
        run: |
          python tests/gui_smoke_test.py
      - name: Upload GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Database-Yedekle-GUI-Screenshots
          path: gui-test-output/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Create distribution package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist/Database Yedekle.exe" package/
          Copy-Item "Database_Yedekle_Logo.svg" package/
          Copy-Item "Database-Yedekle.ico" package/
          if (Test-Path license-public-jwk.json) { Copy-Item "license-public-jwk.json" package/ }
          @(
            "Database Yedekle - Windows"
            "=========================="
            ""
            "1. Extract this ZIP to a folder."
            "2. Run Database Yedekle.exe."
            "3. The application opens in the redesigned PySide6/Qt interface."
            "4. Google Drive and Dropbox uploads are available after connecting the account in the app."
            "5. SQL command-line tools are bundled when installation succeeds; SQL Server still requires a compatible Microsoft ODBC Driver."
            "6. S3-compatible targets support AWS S3, Cloudflare R2, and MinIO."
            "7. Dropbox is enabled when DROPBOX_APP_KEY is configured for the build; users authorize once from the app."
            "8. For remote QNAP, enable/configure SFTP on QNAP and enter its hostname, port, username, password, and remote directory."
            "9. This build is not code-signed, so Windows SmartScreen may still show a warning."
          ) | Set-Content -Encoding utf8 package/README.txt
          if (Test-Path client_secrets.json) { Remove-Item client_secrets.json -Force }
          if (Test-Path dropbox_app_key.txt) { Remove-Item dropbox_app_key.txt -Force }
          if (Test-Path supabase_anon_key.txt) { Remove-Item supabase_anon_key.txt -Force }
          Compress-Archive -Path package/* -DestinationPath "Database-Yedekle-Windows.zip" -Force

      - name: Upload ZIP package
        uses: actions/upload-artifact@v4
        with:
          name: Database-Yedekle-Windows
          path: Database-Yedekle-Windows.zip
          if-no-files-found: error
          retention-days: 30
