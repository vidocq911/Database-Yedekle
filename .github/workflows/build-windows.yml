name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all googleapiclient --collect-all google_auth_oauthlib --collect-all google.auth --name "Database Yedekle" Database_Yedekle.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Database-Yedekle-Windows
          path: dist/Database Yedekle.exe
          if-no-files-found: error
          retention-days: 30
